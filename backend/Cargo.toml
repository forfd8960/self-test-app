[package]
name = "self_test_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
async-openai = { version = "0.32.4", features = ["chat-completion"] }
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
jsonwebtoken = "9"
pdf-extract = "0.10.0"
quick-xml = "0.31"
rand_core = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["macros", "serde"] }
tokio = { version = "1.49", features = ["fs", "macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zip = "2.2"
